<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — Social Media Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-mark">P</span>
    <span class="logo-text">Pulse</span>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-item active" data-view="overview">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Overview</span>
    </button>
    <button class="nav-item" data-view="analytics">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Analytics</span>
    </button>
    <button class="nav-item" data-view="posts">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span>Posts</span>
    </button>
    <button class="nav-item" data-view="schedule">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Schedule</span>
    </button>
    <button class="nav-item" data-view="platforms">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span>Platforms</span>
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="user-chip" id="userChip">
      <div class="avatar" id="avatarEl">AR</div>
      <div class="user-info">
        <span class="user-name" id="userName">Alex Rivera</span>
        <span class="user-handle" id="userHandle">@alexrivera</span>
      </div>
    </div>
  </div>
</aside>

<!-- ── MAIN ────────────────────────────────── -->
<main class="main-content">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="page-title" id="pageTitle">Overview</h1>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="refreshBtn" title="Refresh stats">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <div class="notif-wrap">
        <button class="icon-btn" id="notifBtn" title="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge" id="notifBadge">0</span>
        </button>
        <div class="notif-panel" id="notifPanel"></div>
      </div>
      <button class="btn-primary" id="newPostBtn">+ New Post</button>
    </div>
  </header>

  <!-- ── VIEWS ──────────────────────────────── -->

  <!-- OVERVIEW -->
  <section class="view active" id="view-overview">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="section-row">
      <div class="chart-card wide">
        <div class="card-header">
          <h3>Follower Growth <span class="tag">30 days</span></h3>
          <select id="growthPlatform" class="mini-select">
            <option value="all">All Platforms</option>
          </select>
        </div>
        <canvas id="growthChart" height="110"></canvas>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>Platform Split</h3></div>
        <canvas id="donutChart" height="160"></canvas>
      </div>
    </div>
    <div class="section-row">
      <div class="card" style="flex:1">
        <div class="card-header"><h3>Recent Posts</h3><a class="link" onclick="switchView('posts')">See all →</a></div>
        <div id="recentPostsList" class="posts-list"></div>
      </div>
      <div class="card" style="min-width:280px;max-width:320px">
        <div class="card-header"><h3>Upcoming Scheduled</h3></div>
        <div id="scheduledList" class="scheduled-list"></div>
      </div>
    </div>
  </section>

  <!-- ANALYTICS -->
  <section class="view" id="view-analytics">
    <div class="filter-bar">
      <select id="analyticsFilter" class="mini-select">
        <option value="all">All Platforms</option>
      </select>
      <select id="periodFilter" class="mini-select">
        <option value="7">Last 7 days</option>
        <option value="30" selected>Last 30 days</option>
      </select>
    </div>
    <div class="analytics-grid" id="analyticsGrid"></div>
    <div class="section-row">
      <div class="chart-card wide">
        <div class="card-header"><h3>Engagement Rate Trend</h3></div>
        <canvas id="engagementChart" height="110"></canvas>
      </div>
      <div class="chart-card">
        <div class="card-header"><h3>Followers by Platform</h3></div>
        <canvas id="barChart" height="160"></canvas>
      </div>
    </div>
  </section>

  <!-- POSTS -->
  <section class="view" id="view-posts">
    <div class="filter-bar">
      <select id="postPlatformFilter" class="mini-select">
        <option value="all">All Platforms</option>
      </select>
      <button class="btn-primary sm" id="composeBtn">+ Compose</button>
    </div>
    <div class="posts-grid" id="postsGrid"></div>
  </section>

  <!-- SCHEDULE -->
  <section class="view" id="view-schedule">
    <div class="filter-bar">
      <button class="btn-primary sm" id="scheduleNewBtn">+ Schedule Post</button>
    </div>
    <div class="schedule-table-wrap">
      <table class="schedule-table">
        <thead><tr><th>Platform</th><th>Caption</th><th>Scheduled For</th><th>Status</th><th></th></tr></thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>
  </section>

  <!-- PLATFORMS -->
  <section class="view" id="view-platforms">
    <div class="platforms-grid" id="platformsGrid"></div>
  </section>
</main>

<!-- ── MODALS ──────────────────────────────── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
